name: Build Website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Check generated content is synchronized
        run: git diff --exit-code -- index.html
      - uses: actions/upload-artifact@v4
        with:
          name: website-release
          path: |
            release/index.html
            release-manifest.json
